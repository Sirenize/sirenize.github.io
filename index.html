<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="./style.css">
</head>
    <body>
        <div class="desktop">
            <div class="program" id="RB">
                <button id="openRB"></button>
                <p>Recycle Bin</p>
            </div>
            <div class="program" id="CAE">
                <button id="openCAE"></button>
                <p>College App</p>
            </div>
            <div class="program" id="ECLIPSE">
                <button id="openECLIPSE"></button>
                <p>Eclipsed</p>
            </div>
        </div>

        <div class="navbar">
            <button id="startbutton">
                <img src="images/windows-0.png" width="20px">
                <p>Start</p>
            </button>
            <div id="verticalline"></div>
            <ul class="nav__buttons">
                <div class="navbuttontemplate">
                    <button class="navbutton"><p>NAME</p></button>
                </div>
            </ul>
        </div>
        <div class="windowtemplate">
            <div class="window" id="">
                <div class="header">
                    <p id="windowtitle"></p>
                    <div class="buttons">
                        <div>
                            <button id="minimize"></button>
                            <button id="maximize"></button>
                            <button id="close"></button>
                        </div>
                    </div>
                </div>
                <div class="windowbody">
                    <embed src="" width="100%" height="100%">
                </div>
                    <div class="corner"></div>
                </div>
        </div>
        <script src="main.js"></script>
        <script src="windowhandler.js"></script>
    </body>
</html>
